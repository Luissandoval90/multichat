name: Build Multi Chat Overlay Pro

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish with Electron-Builder
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create source ZIP
        shell: pwsh
        run: |
          $items = @('main.js','preload.js','overlay.html','obs.html','multichat.png','styles','src','platforms','package.json','package-lock.json','README.md','iniciar.bat')
          Compress-Archive -Path $items -DestinationPath 'MultiChat-Overlay-Pro-v2.4.0-source.zip' -Force

      - name: Attach source ZIP and mark latest release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            MultiChat-Overlay-Pro-v2.4.0-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
