name: Build Multi Chat Overlay Pro

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clean invalid releases
        shell: pwsh
        run: |
          $headers = @{
            "Authorization" = "Bearer ${{ secrets.GITHUB_TOKEN }}"
            "Accept" = "application/vnd.github+json"
          }
          try {
            $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/Luissandoval90/multichat/releases" -Headers $headers
            foreach ($rel in $releases) {
              if ($rel.tag_name -eq 'main' -or $rel.name -eq 'Release main') {
                Write-Host "Deleting invalid release $($rel.id)..."
                Invoke-RestMethod -Uri "https://api.github.com/repos/Luissandoval90/multichat/releases/$($rel.id)" -Method Delete -Headers $headers
              }
            }
          } catch {
            Write-Host "Notice: $_"
          }

      - name: Build and Publish with Electron-Builder
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create source ZIP
        shell: pwsh
        run: |
          $items = @('main.js','preload.js','overlay.html','obs.html','multichat.png','styles','src','platforms','package.json','package-lock.json','README.md','iniciar.bat')
          Compress-Archive -Path $items -DestinationPath 'MultiChat-Overlay-Pro-v2.4.0-source.zip' -Force

      - name: Attach source ZIP and set latest release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            MultiChat-Overlay-Pro-v2.4.0-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
