name: Build Multi Chat Overlay Pro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply premium UI layer
        shell: pwsh
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['overlay.html', 'obs.html']) {
            let html = fs.readFileSync(file, 'utf8');
            if (!html.includes('styles/premium.css')) {
              html = html.replace(
                '<link rel="stylesheet" href="styles/style.css" />',
                '<link rel="stylesheet" href="styles/style.css" />\n  <link rel="stylesheet" href="styles/premium.css" />'
              );
            }
            html = html.replace(/<body([^>]*)>/i, (m, attrs) => {
              if (/class=/i.test(attrs)) {
                attrs = attrs.replace(/class="([^"]*)"/i, (_, classes) => `class="${classes} premium-shell"`);
              } else {
                attrs += ' class="premium-shell"';
              }
              return `<body${attrs}>`;
            });
            fs.writeFileSync(file, html, 'utf8');
          }
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '2.4.0';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run dist

      - name: Create source ZIP
        shell: pwsh
        run: |
          $items = @('main.js','preload.js','overlay.html','obs.html','multichat.png','styles','src','platforms','package.json','package-lock.json','README.md','iniciar.bat')
          Compress-Archive -Path $items -DestinationPath 'MultiChat-Overlay-Pro-v2.4.0-source.zip' -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiChat-Overlay-Pro-v2.4.0-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            MultiChat-Overlay-Pro-v2.4.0-source.zip
          if-no-files-found: error
