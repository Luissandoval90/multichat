name: Build Multi Chat Overlay Pro

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check known dependency vulnerabilities
        run: npm audit --audit-level=moderate

      - name: Test application and browser extension
        run: npm run prepare:piper && npm test -- --screenshots

      - name: Build and Publish with Electron-Builder
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create source and extension ZIPs
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $items = @('main.js','preload.js','overlay.html','obs.html','multichat.png','styles','assets','src','platforms','browser-extension','tests','scripts','package.json','package-lock.json','README.md','PIPER.md','MUSICA.md','DISTRIBUCION.md','iniciar.bat')
          Compress-Archive -Path $items -DestinationPath "MultiChat-v$version-source.zip" -Force
          Compress-Archive -Path 'browser-extension/*' -DestinationPath "MultiChat-Spotify-v$version.zip" -Force

      - name: Attach source ZIP and set latest release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          files: |
            MultiChat-v*-source.zip
            MultiChat-Spotify-v*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
