<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' ws://localhost:3750 ws://127.0.0.1:3750; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>MultiChat - OBS Browser Source</title>
  <link rel="icon" type="image/png" href="multichat.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@500;700;800&family=Orbitron:wght@600;800&family=Outfit:wght@500;700;800&family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/style.css" />
  <link rel="stylesheet" href="styles/chat.css" />
  <link rel="stylesheet" href="styles/alerts.css" />
  <style>
    body {
      background: transparent !important;
      overflow: hidden;
    }
    #obs-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      padding: 10px;
      box-sizing: border-box;
      position: relative;
    }
    #obs-pinned-box {
      margin-bottom: 8px;
    }
    #chat-container {
      flex: 1;
      overflow-y: hidden;
    }
    .obs-connection-indicator {
      position: fixed;
      bottom: 6px;
      right: 8px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 4px;
      display: none;
    }
  </style>
</head>
<body class="theme-obsidian">
  <div id="obs-container">
    <div id="follower-alert-container"></div>
    <div id="pinned-message-container" class="hidden"></div>
    <div id="chat-container"></div>
    <div id="obs-status" class="obs-connection-indicator">Conectando a MultiChat…</div>
  </div>

  <script src="src/safe-content.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/alerts.js"></script>
  <script src="src/chat-presence.js"></script>
  <script src="src/chat-presentation.js"></script>
  <script src="src/obs.js"></script>
</body>
</html>
